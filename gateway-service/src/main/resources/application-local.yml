# 本地直连模式：不依赖 Nacos，网关直连各服务固定地址
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
        - id: course-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/course/**
        - id: selection-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/selection/**
        - id: recommend-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/recommend/**
        - id: statistics-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/statistics/**
